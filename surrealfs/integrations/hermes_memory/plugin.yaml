name: surrealfs-memory
version: 0.3.0
description: >-
  Memory backed by SurrealFS — files every turn under the agent's own home in a
  SurrealDB-backed filesystem, and recalls context by searching the tree, the agent's
  own notes included and other agents' homes not. Connection details come from the
  SURREALDB_* env vars.
author: Martin Schaer
# Wiring, unlike `hooks:` below: `hermes memory setup` installs these into Hermes' own
# virtualenv, and `hermes update` reinstalls them after a venv sync strips or downgrades
# them. This is the whole bootstrap — which is also why the imports in __init__.py are
# deferred into the methods that use them, so discovery can list a provider whose
# dependency is not installed yet.
pip_dependencies:
  - surrealfs
# The same dependency in the form that can actually be fetched today, since surrealfs is
# not on PyPI. Declaration only: `hermes plugins install` prints this list and installs
# nothing from it, which is why it may carry a URL where `pip_dependencies` may not —
# specs containing `@` or `://` are rejected there as unsafe. Both entries stay: this one
# is what a user runs by hand now, that one is what heals the venv after publication.
python_dependencies:
  - "surrealfs @ git+https://github.com/surrealdb/surrealfs.git"
# Everything the provider implements beyond the required lifecycle. Nothing in
# Hermes reads this — memory discovery only takes `description` out of here — but
# the plugin docs ask for it, and it is the only place the set is written down.
hooks:
  - system_prompt_block
  - prefetch
  - queue_prefetch
  - sync_turn
  - on_session_switch
  - on_memory_write
  - on_pre_compress
# Routes this directory to Hermes' memory-provider discovery rather than the general
# plugin manager. Without it, `hermes_cli/plugins.py` infers the same thing by
# scanning this __init__.py for the string "MemoryProvider" — declaring it is
# cheaper than depending on that heuristic.
kind: exclusive

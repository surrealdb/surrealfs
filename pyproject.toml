[project]
name = "surrealfs"
version = "0.2.0"
description = "A filesystem for agents, backed by SurrealDB"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Martin Schaer", email = "martin.schaer@surrealdb.com" }
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "surrealdb>=3.0.0a4",
    "pydantic>=2.12",
]

[project.optional-dependencies]
pydantic-ai = ["pydantic-ai-slim>=2.0"]
# What `surrealfs.embed` needs, without the rest of the demo stack.
embed = ["openai>=2.0"]
demo = [
    "pydantic-ai-slim[web,anthropic]>=2.0",
    "anthropic>=0.40",
    "openai>=2.0",
    "logfire>=4.20",
    "uvicorn>=0.30",
    # Only a transitive dep of rich today; the file browser imports it directly.
    "markdown-it-py>=3",
]

# Lets Hermes discover the plugin in `surrealfs/integrations/hermes/` as soon as
# the package is installed. Nothing imports Hermes, so there is no extra to add.
[project.entry-points."hermes_agent.plugins"]
surrealfs = "surrealfs.integrations.hermes"

[dependency-groups]
# pydantic-ai is here as well as in the extra so `just test` exercises that
# integration instead of silently skipping its tests.
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pydantic-ai-slim>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["surrealfs"]

[tool.hatch.build]
artifacts = [
    "surrealfs/schema/*.surql",
    "surrealfs/tools/docs/*.md",
    "surrealfs/integrations/*/README.md",
    "surrealfs/integrations/hermes/plugin.yaml",
    "surrealfs/integrations/hermes/skills/**/SKILL.md",
    "surrealfs/integrations/hermes_memory/plugin.yaml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project]
name = "surrealfs"
version = "0.2.0"
description = "A filesystem for agents, backed by SurrealDB"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Martin Schaer", email = "martin.schaer@surrealdb.com" }
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # Pinned exactly, not a floor. The 3.x betas are not compatible with each
    # other in ways that surface as wrong answers rather than errors: 3.0.0b8
    # changed `RecordID.__str__` to escape ids, which silently made `ls` return
    # no children for any folder whose own record id starts with a digit (see
    # `_parent_key` in fs.py). A `>=` floor also let `uv.lock` and
    # `pip install surrealfs` resolve different SDKs, so the suite passed while
    # every fresh install was broken. Loosen this when 3.0 goes final.
    "surrealdb==3.0.0b8",
    "pydantic>=2.12",
]

[project.optional-dependencies]
pydantic-ai = ["pydantic-ai-slim>=2.0"]
# What `surrealfs.embed` needs, without the rest of the demo stack.
embed = ["openai>=2.0"]
# The MCP server (`surrealfs-mcp`), for any client that speaks MCP.
#
# `mcp>=2.1` is a real floor, not caution: `serve()` builds the lowlevel
# `Server` with `on_list_tools=`/`on_call_tool=` handlers, which 1.x does not
# have -- there they are decorators -- so a resolver that picked a 1.x would
# raise `TypeError: unexpected keyword argument` on launch, which a client
# reports as nothing but "no such tools".
mcp = ["mcp>=2.1", "python-dotenv>=1"]
# Agent memory, the hosted memory layer behind `brain_recall`, is a managed service
# that needs a context id and an API key -- so the MCP server has to be complete
# without it, and this is its own extra rather than part of `mcp`. The client is a
# handful of functions in `integrations/mcp/agent_memory.py` which import httpx inside
# themselves, so nothing here is needed until AGENT_MEMORY_CONTEXT_ID and
# AGENT_MEMORY_API_KEY are set. httpx is listed because that module imports it
# directly and it is *not* a transitive of `mcp` any more: mcp 2.x depends on
# `httpx2`.
agent-memory = ["httpx>=0.27"]
# An alias, and not politeness: a Claude plugin copies `.mcp.json` in at install
# time, so every already-installed plugin keeps asking for
# `surrealfs[claude] @ git+...` and would fail to build if this went away. It
# pulls `agent-memory` as well: a plugin whose whole point is the brain that was
# resolved without httpx mirrored nothing, and said so only inside a tool result.
claude = ["surrealfs[mcp,agent-memory]"]
# The file browser (`surrealfs-browser`). starlette is listed explicitly because
# it reaches the tree today only as a transitive of pydantic-ai's `web` extra,
# and it is imported directly here. The page itself is a React SPA -- see
# `surrealfs/browser/ui/` -- so nothing renders markdown on this side any more.
browser = [
    "starlette>=0.37",
    "uvicorn>=0.30",
    "pydantic-ai-slim[anthropic]>=2.0",
    "python-dotenv>=1",
    "openai>=2.0",
]
demo = [
    "pydantic-ai-slim[web,anthropic]>=2.0",
    "anthropic>=0.40",
    "openai>=2.0",
    "logfire>=4.20",
    "uvicorn>=0.30",
]

[project.scripts]
surrealfs-browser = "surrealfs.browser.__main__:main"
# What an MCP client launches over stdio. See
# `surrealfs/integrations/mcp/README.md`.
surrealfs-mcp = "surrealfs.integrations.mcp:main"

# Lets Hermes discover the plugin in `surrealfs/integrations/hermes/` as soon as
# the package is installed. Nothing imports Hermes, so there is no extra to add.
[project.entry-points."hermes_agent.plugins"]
surrealfs = "surrealfs.integrations.hermes"

[dependency-groups]
# pydantic-ai and the packages of the `mcp` and `agent-memory` extras are here as well
# as in those extras so `just test` exercises those integrations instead of silently
# skipping their tests. python-dotenv is not optional among them: without it
# `_load_config` takes its ImportError branch and returns None, and
# `test_the_config_file_is_a_default_not_a_mandate` fails rather than skips.
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pydantic-ai-slim>=2.0",
    "mcp>=2.1",
    "httpx>=0.27",
    "python-dotenv>=1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["surrealfs"]
# The page's TypeScript source. `static/` below is what it compiles to, and that
# is what ships; nobody installing the wheel builds it.
exclude = ["surrealfs/browser/ui"]

[tool.hatch.build]
artifacts = [
    # The vite build output, which is gitignored: `just ui` before `hatch build`
    # or the wheel ships an API with no page in front of it.
    "surrealfs/browser/static/**",
    "surrealfs/schema/*.surql",
    "surrealfs/tools/docs/*.md",
    "surrealfs/integrations/*/README.md",
    "surrealfs/integrations/hermes/plugin.yaml",
    "surrealfs/integrations/hermes/skills/**/SKILL.md",
    "surrealfs/integrations/hermes_memory/plugin.yaml",
    "surrealfs/integrations/claude/skills/**/SKILL.md",
    # The plugin manifest, its bundled MCP config, and the launcher that config
    # names, so `pip install` ships a directory that is still a valid Claude
    # plugin.
    "surrealfs/integrations/claude/.claude-plugin/plugin.json",
    "surrealfs/integrations/claude/.mcp.json",
    "surrealfs/integrations/claude/scripts/surrealfs-mcp",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

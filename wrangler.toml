name = "surrealfs"
main = "worker/index.mjs"
compatibility_date = "2025-03-01"

[build]
command = "cargo build --locked -p surrealfs-server --target wasm32-unknown-unknown --release && wasm-bindgen target/wasm32-unknown-unknown/release/surrealfs_server.wasm --target web --out-dir pkg"

[assets]
directory = "./surrealfs/browser/static"
binding = "ASSETS"
not_found_handling = "single-page-application"

# File content larger than the inline threshold lives in this bucket, written and read directly by
# the Worker. Create it once with `wrangler r2 bucket create surrealfs-blobs`.
[[r2_buckets]]
binding = "BLOBS"
bucket_name = "surrealfs-blobs"

[triggers]
crons = ["17 3 * * *"]

[vars]
SURREALDB_NS = "surrealfs"
SURREALDB_DB = "main"
SURREALFS_EMBED_MODEL = "text-embedding-3-small"
SURREALFS_CHAT_MODEL = "claude-sonnet-4-6"
# Set secrets via `wrangler secret put`:
# - SURREALDB_URL (e.g., https://your-instance.cloud.surrealdb.com)
# - SURREALDB_USER / SURREALDB_PASS or SURREALDB_TOKEN
# - OPENAI_API_KEY (optional, enables server-side embeddings on file writes)
# - ANTHROPIC_API_KEY (optional, enables server-side /api/chat agent)
# - SURREALFS_SERVER_TOKEN (optional, shared bearer token for Layer 1 clients)

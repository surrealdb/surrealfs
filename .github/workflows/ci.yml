name: CI

on:
  push:
    branches: [main, next]
  pull_request:

env:
  SURREAL_VERSION: v4.0.0
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install SurrealDB
        run: |
          curl -sSf https://install.surrealdb.com | sh -s -- --version "$SURREAL_VERSION"
          surreal version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets
      - run: cargo test --locked --workspace
      - run: cargo check --locked -p surrealfs-core -p surrealfs-server --target wasm32-unknown-unknown

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Install SurrealDB
        run: |
          curl -sSf https://install.surrealdb.com | sh -s -- --version "$SURREAL_VERSION"
          surreal version
      - run: uv run --locked ruff check .
      - run: surreal validate surrealfs/schema/*.surql
      - run: uv run --locked pytest --quiet --no-summary

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install SurrealDB
        run: |
          curl -sSf https://install.surrealdb.com | sh -s -- --version "$SURREAL_VERSION"
          surreal version
      - run: bun install --frozen-lockfile
        working-directory: packages/sdk-ts
      - run: bun test
        working-directory: packages/sdk-ts
      - run: bun install --frozen-lockfile
        working-directory: surrealfs/browser/ui
      - run: bun test
        working-directory: surrealfs/browser/ui

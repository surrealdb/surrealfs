anyhow.workspace = true
tracing.workspace = true
libc = "0.2"
parking_lot = "0.12"
chrono.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
surrealdb.workspace = true
tempfile = "3.17"

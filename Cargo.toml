[package]
name = "surrealfs"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
surrealdb = { version = "3.0.4", features = ["kv-mem", "kv-rocksdb"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
regex = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
pyo3 = { version = "0.28", features = ["abi3-py312"] }
pyo3-stub-gen = { version = "0.19" }
similar = "2"
globset = "0.4"
serde_bytes = "0.11"
rimage = "0.12.2"
zune-core = "=0.5.0"
zune-image = "=0.5.0-rc0"

[[bin]]
name = "stub_gen"
path = "src/bin/stub_gen.rs"
# required-features = ["python"]

[dev-dependencies]

[features]
default = []
# python = ["pyo3", "pyo3-stub-gen"]
extension-module = ["pyo3/extension-module"]

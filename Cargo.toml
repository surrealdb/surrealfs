[workspace]
members = [
    "crates/surrealfs-core",
    "crates/surrealfs-cli",
    "crates/surrealfs-sim",
    "crates/surrealfs-fuse",
    "crates/surrealfs-shim",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["SurrealDB Authors"]
license = "Apache-2.0"

[workspace.dependencies]
surrealdb = { version = "3.0.0-alpha.13", default-features = false, features = ["protocol-ws", "rustls"] }
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.11"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
blake3 = "1.5"
zstd = "0.13"
fastcdc = "1.0"
